##############################################
# LightRAG 3080 Server — Docker Compose
# 与已有的 ollama/neo4j/qdrant/redis/docling/minio 容器协同
##############################################
services:
  lightrag:
    image: lightrag:local
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "9621:9621"
    volumes:
      - ./rag_storage:/app/rag_storage
      - ./inputs:/app/inputs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: "0.0.0.0"
      PORT: "9621"
      WORKING_DIR: "/app/rag_storage"
      INPUT_DIR: "/app/inputs"
      # --- LLM: DeepSeek V3 ---
      LLM_BINDING: "openai"
      LLM_BINDING_HOST: "https://api.deepseek.com"
      LLM_BINDING_API_KEY: "sk-ed9b4c34f6b844b09f9b0ca909808223"
      LLM_MODEL: "deepseek-v4-flash"
      MAX_ASYNC: "6"
      LLM_TIMEOUT: "240"
      # --- Embedding: Ollama (host.docker.internal) ---
      EMBEDDING_BINDING: "ollama"
      EMBEDDING_BINDING_HOST: "http://host.docker.internal:11434"
      EMBEDDING_MODEL: "bge-m3"
      EMBEDDING_FUNC_MAX_ASYNC: "8"
      EMBEDDING_BATCH_NUM: "32"
      # --- Storage ---
      LIGHTRAG_GRAPH_STORAGE: "Neo4JStorage"
      NEO4J_URI: "bolt://host.docker.internal:7687"
      NEO4J_USERNAME: "neo4j"
      NEO4J_PASSWORD: "Superv@1"
      LIGHTRAG_VECTOR_STORAGE: "QdrantVectorDBStorage"
      QDRANT_URL: "http://host.docker.internal:6333"
      LIGHTRAG_KV_STORAGE: "RedisKVStorage"
      LIGHTRAG_DOC_STATUS_STORAGE: "RedisDocStatusStorage"
      REDIS_URI: "redis://:Superv%401@host.docker.internal:6379"
      # --- Parser ---
      LIGHTRAG_PARSER: "*:native-eP;*:docling-eP;*:legacy-R"
      DOCLING_ENDPOINT: "http://host.docker.internal:5001"
      MAX_PARALLEL_PARSE_DOCLING: "4"
      # --- MinIO ---
      MINIO_ENDPOINT: "host.docker.internal:9000"
      MINIO_ACCESS_KEY: "admin"
      MINIO_SECRET_KEY: "Superv@1"
      MINIO_BUCKET: "lightrag-images"
      # --- VLM ---
      VLM_PROCESS_ENABLE: "true"
      VLM_LLM_BINDING: "ollama"
      VLM_LLM_BINDING_HOST: "http://host.docker.internal:11434"
      VLM_LLM_MODEL: "qwen3-vl:latest"
      VLM_LLM_BINDING_API_KEY: ""
      VLM_MAX_ASYNC_LLM: "4"
      VLM_LLM_TIMEOUT: "300"
      # --- Query ---
      TOP_K: "60"
      CHUNK_TOP_K: "20"
      MAX_ENTITY_TOKENS: "6000"
      MAX_RELATION_TOKENS: "8000"
      MAX_TOTAL_TOKENS: "30000"
      COSINE_THRESHOLD: "0.2"
      SUMMARY_LANGUAGE: "Chinese"
      MAX_PARALLEL_INSERT: "3"
    restart: unless-stopped
